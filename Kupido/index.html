<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To My Babi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <!-- Floating hearts are created here by script.js -->
  <div id="particles" aria-hidden="true"></div>

  <main>

    <!-- SCREEN 1: THE GIFT -->
    <section id="screen-gift" class="screen active">
      <div class="gift-card">
        <div class="gift-icon heartbeat">🎁</div>
        <p class="tiny"> Hallooo</p>
        <h1 id="giftText"></h1>
        <button id="openBtn" class="btn primary">OPEN</button>
      </div>
    </section>

    <!-- SCREEN 2: CHOOSE -->
    <section id="screen-menu" class="screen">
      <h2 id="menuTitle" class="hand"></h2>
      <p id="menuSub" class="tiny"></p>
      <div class="choices">
        <button class="choice" data-type="letter">
          <span class="ico">💌</span><span class="label hand">Letter</span>
        </button>
        <button class="choice" data-type="poem">
          <span class="ico">📝</span><span class="label hand">Poem</span>
        </button>
      </div>
    </section>

    <!-- SCREEN 3: READING -->
    <section id="screen-read" class="screen">
      <article class="paper">
        <h2 id="readTitle" class="hand"></h2>
        <div id="paperBody" class="paper-body">
          <div id="typed" class="typed"></div>
          <p id="sign" class="sign hand"></p>
        </div>
      </article>
      <div class="actions">
        <button id="skipBtn" class="btn">Skip </button>
        <button id="replayBtn" class="btn hidden">Read again ↻</button>
        <button id="backBtn" class="btn hidden">Back to gifts</button>
      </div>
    </section>

  </main>

  <!-- MUSIC CONTROL (hidden automatically if no music link) -->
  <div id="music" class="music hidden">
    <button id="musicBtn" aria-label="Play or pause music">♪</button>
    <span id="bars" class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
    <input id="volume" type="range" min="0" max="1" step="0.05" aria-label="Volume">
  </div>

  <div id="toast" class="toast"></div>

  
  <script src="script.js"></script>
</body>
</html>
